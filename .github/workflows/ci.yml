# CI (SPEC 14): runs on every push. No secrets are used: tests, the eval check (replay from committed cache) and the demo are offline.
name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: make setup
      - run: make test
      - run: make invariants
      - run: make eval-check
      - run: make verify
      - run: make demo
      - run: make evidence
